<!-- De werkwijzefilm van 20 seconden, in 3D (hetzelfde crème kozijn als de hero). Staat op de
     homepage en op /werkwijze via {{film}} in de bron; build.py zet dit bestand daar neer.

     Het beeld tekent js/kozijn-3d.js (bron: beweging/3d kozijn/src/g-werkwijze.js); js/film.js
     speelt het af en laat de blokken in .film-tekst in deze volgorde zien, op de tijden in
     WBLOKKEN in g-werkwijze.js. Een tekst aanpassen kan hier. De poster is het beginbeeld
     (tot het script tekent); zonder WebGL staat er het eindbeeld. -->
<figure class="film" data-film>
  <img class="film-merk" src="/images/logo/iwrap-logo-liggend.svg" width="210" height="44" alt="">
  <div class="film-tekst">
    <div><p class="film-stap">Zo begint het</p><p class="film-zin">Je kozijn is nog goed. Alleen de folie is versleten.</p></div>
    <div><p class="film-stap">Stap 1 · Offerte</p><p class="film-zin">Stuur een foto van het hele kozijn en streep aan wat er moet. Je krijgt een vaste prijs.</p></div>
    <div><p class="film-stap">Stap 2 · Afspraak</p><p class="film-zin">Je weet vooraf wie er komt, en wanneer.</p></div>
    <div><p class="film-stap">Stap 3 · Verwijderen en reinigen</p><p class="film-zin">Oude folie en lijmresten eraf, alles vetvrij.</p></div>
    <div><p class="film-stap">Stap 4 · Aanbrengen</p><p class="film-zin">Nieuwe folie erop. Meestal in één à twee dagen.</p></div>
    <div><p class="film-stap">Klaar</p><p class="film-zin">Weer als nieuw.</p></div>
    <div class="film-slot">
      <img class="film-logo" src="/images/logo/iwrap-logo-liggend.svg" width="210" height="44" alt="iWrap">
      <ul>
        <li>Vaste prijs vooraf</li>
        <li>10 jaar garantie op de folie</li>
        <li>Opgeruimd achtergelaten</li>
      </ul>
      <p class="film-score"><span aria-hidden="true">★</span> {{rv.score}} uit {{rv.aantal}} Google-reviews</p>
      <a class="knop knop-primair film-cta" href="/offerte">Offerte aanvragen</a>
      <p class="film-adres">www.iwrap.nl</p>
    </div>
  </div>
  <div class="film-beeld">
    <x-beeld src="werkwijze-3d-start" class="film-poster" sizes="(max-width:700px) 100vw, 680px" alt="">
    <canvas class="film-doek" aria-hidden="true"></canvas>
    <span class="film-label film-voor" aria-hidden="true">Voor</span>
    <span class="film-label film-na" aria-hidden="true">Na</span>
    <button class="film-knop speelknop" type="button" aria-label="Film afspelen">
      <svg class="icoon-pauze" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z" fill="currentColor"/></svg>
      <svg class="icoon-speel" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
      <svg class="icoon-opnieuw" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="film-voortgang" aria-hidden="true"><span></span></div>
  </div>
</figure>
