<!doctype html>
<html lang="nl" class="js"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&display=block">
<style>
:root{--mint:#a3cdc2;--mint-soft:#dbece7;--mint-wash:#eef6f3;--mint-ink:#3f7468;--mint-deep:#2f5a50;--ink:#22262a;--ink-soft:#3a4047;--sub:#646b73;--paper:#f7f6f3;--white:#fff;--line:#e3e1db;--line-strong:#cfccc4;--radius:18px;--shadow:0 1px 2px rgba(34,38,42,.05), 0 8px 24px -12px rgba(34,38,42,.18);--beweeg:cubic-bezier(.22,.7,.25,1);--kort:.2s;--middel:.3s;--kop:'Montserrat',sans-serif;--tekst:'Inter',sans-serif;}
body{margin:0;background:var(--paper);font-family:var(--tekst);color:var(--ink);}
.wrap{max-width:1180px;margin:0 auto;padding:40px 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.04fr);gap:48px;align-items:center;}
h1{font-family:var(--kop);font-size:2.6rem;line-height:1.1;margin:0 0 16px;}
@media (max-width:900px){.wrap{grid-template-columns:1fr;}}
</style>
<link rel="stylesheet" href="kozijn-3d.css">
<style>.k3d-beeld{background-image:url("media/kozijn-3d-start.jpg")}.kozijn-3d.k3d-geen-webgl .k3d-beeld{background-image:url("media/kozijn-3d-eind.jpg")}</style>
</head><body>
<div class="wrap">
  <div><h1>Kunststof kozijnen herstellen met Renolit folie</h1><p>Proefpagina voor de 3D-animatie.</p></div>
  <figure class="kozijn-3d" data-kozijn-3d>
    <div class="k3d-beeld">
      <canvas aria-hidden="true"></canvas>
      <p class="k3d-zin is-leeg"></p>
      <button class="k3d-opnieuw" type="button" hidden>Opnieuw</button>
    </div>
    <ol class="k3d-stappen" aria-label="De drie stappen">
      <li><button type="button" data-stap="1"><span class="k3d-nr">1</span><span>Toplaag eraf</span></button></li>
      <li><button type="button" data-stap="2"><span class="k3d-nr">2</span><span>Reinigen en vetvrij</span></button></li>
      <li><button type="button" data-stap="3"><span class="k3d-nr">3</span><span>Nieuwe folie erop</span></button></li>
    </ol>
    <figcaption>Zo herstellen we een kozijn: de oude folie eraf, de ondergrond schoon en vetvrij, nieuwe folie erop.</figcaption>
  </figure>
</div>
<script src="kozijn3d.js"></script>
</body></html>
